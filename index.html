<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Countdown">
<title>Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="days" id="days" aria-live="off">0</p>
  <p class="days-label" id="daysLabel">days to go</p>
  <p class="clock" id="clock"></p>
  <p class="when" id="when"></p>

  <section class="updates" aria-labelledby="updatesTitle">
    <h2 id="updatesTitle">Today</h2>
    <form class="update-form" id="updateForm">
      <label class="sr-only" for="updateInput">Add an update</label>
      <input
        id="updateInput"
        name="update"
        type="text"
        maxlength="160"
        placeholder="What are you doing?"
        autocomplete="off"
        required
      >
      <button type="submit">Add update</button>
    </form>
    <p class="update-status" id="updateStatus" role="status" aria-live="polite"></p>
    <div class="updates-table-wrap">
      <table class="updates-table">
        <caption class="sr-only">Today's updates</caption>
        <thead>
          <tr>
            <th scope="col">Time</th>
            <th scope="col">Update</th>
          </tr>
        </thead>
        <tbody id="updatesList"></tbody>
      </table>
      <p class="empty-updates" id="emptyUpdates">No updates yet today.</p>
    </div>
  </section>
</main>

<script>
  // Edit these defaults
  const DEFAULT_DATE  = "2026-12-20";  // YYYY-MM-DD
  const DEFAULT_TITLE = "COUNTDOWN";

  const params = new URLSearchParams(location.search);
  const dateStr = params.get("date") || DEFAULT_DATE;
  const title   = params.get("title") || DEFAULT_TITLE;

  // Parse as local midnight
  const [y, m, d] = dateStr.split("-").map(Number);
  const target = new Date(y, m - 1, d, 0, 0, 0);

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");

  $("title").textContent = title;
  document.title = title;
  $("when").textContent = target.toLocaleDateString(undefined, {
    weekday: "long", year: "numeric", month: "long", day: "numeric"
  });

  function tick() {
    const diff = target - new Date();

    if (isNaN(diff)) {
      $("days").textContent = "?";
      $("daysLabel").textContent = "Check the date: use the format YYYY-MM-DD";
      $("clock").textContent = "";
      return;
    }

    if (diff <= 0) {
      const since = Math.floor(-diff / 86400000);
      $("days").textContent = since === 0 ? "Today" : since;
      $("days").classList.toggle("days--today", since === 0);
      $("daysLabel").textContent = since === 0 ? "It’s here." : (since === 1 ? "day since" : "days since");
      $("clock").textContent = "";
      return;
    }

    const totalSec = Math.floor(diff / 1000);
    const days = Math.floor(totalSec / 86400);
    const hours = Math.floor((totalSec % 86400) / 3600);
    const mins = Math.floor((totalSec % 3600) / 60);
    const secs = totalSec % 60;

    $("days").classList.remove("days--today");
    $("days").textContent = days;
    $("daysLabel").textContent = days === 1 ? "day to go" : "days to go";
    $("clock").textContent = pad(hours) + ":" + pad(mins) + ":" + pad(secs);
  }

  tick();
  setInterval(tick, 1000);

  const { createClient } = supabase;
  const { url: supabaseUrl, anonKey: supabaseAnonKey } = window.SUPABASE_CONFIG;
  const updateForm = $("updateForm");
  const updateInput = $("updateInput");
  const updatesList = $("updatesList");
  const emptyUpdates = $("emptyUpdates");
  const updateStatus = $("updateStatus");
  const updateChannel = location.pathname + location.search;
  const isSupabaseConfigured =
    supabaseUrl && anonKeyIsConfigured(supabaseAnonKey) &&
    !supabaseUrl.includes("YOUR_PROJECT_ID");
  const supabaseClient = isSupabaseConfigured
    ? createClient(supabaseUrl, supabaseAnonKey)
    : null;

  function anonKeyIsConfigured(key) {
    return Boolean(key && !key.includes("YOUR_SUPABASE_ANON_KEY"));
  }

  const getToday = () => {
    const today = new Date();
    return [
      today.getFullYear(),
      pad(today.getMonth() + 1),
      pad(today.getDate())
    ].join("-");
  };

  function renderUpdates(updates) {
    updatesList.replaceChildren();
    emptyUpdates.hidden = updates.length > 0;

    updates.forEach(({ text, created_at }) => {
      const row = document.createElement("tr");
      const timeCell = document.createElement("td");
      const textCell = document.createElement("td");

      timeCell.textContent = new Date(created_at).toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
      });
      textCell.textContent = text;
      row.append(timeCell, textCell);
      updatesList.append(row);
    });
  }

  async function loadUpdates() {
    if (!supabaseClient) {
      updateStatus.textContent = "Add your Supabase settings to enable shared updates.";
      return;
    }

    const { data, error } = await supabaseClient
      .from("countdown_updates")
      .select("text, created_at")
      .eq("channel", updateChannel)
      .eq("update_date", getToday())
      .order("created_at", { ascending: true });

    if (error) {
      updateStatus.textContent = "Updates are temporarily unavailable.";
      console.error("Could not load updates:", error);
      return;
    }

    updateStatus.textContent = "";
    renderUpdates(data);
  }

  updateForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = updateInput.value.trim();

    if (!text || !supabaseClient) {
      return;
    }

    const now = new Date();
    updateStatus.textContent = "Adding update...";

    try {
      const { error } = await supabaseClient
        .from("countdown_updates")
        .insert({
          text,
          channel: updateChannel,
          update_date: getToday(),
          created_at: now.toISOString()
        });

      if (error) {
        updateStatus.textContent = "Could not add update. Please try again.";
        console.error("Could not add update:", error);
        return;
      }

      updateInput.value = "";
      updateStatus.textContent = "Update added.";
      await loadUpdates();
      updateInput.focus();
    } catch (error) {
      updateStatus.textContent = "Could not add update. Please try again.";
      console.error("Could not add update:", error);
    }
  });

  loadUpdates();
  setInterval(loadUpdates, 30000);
</script>
</body>
</html>
