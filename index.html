<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Countdown">
<title>Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f4f8;
    --ink: #14213d;
    --muted: #5d6b86;
    --accent: #3a5bff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101a30;
      --ink: #eef1f8;
      --muted: #97a4c2;
      --accent: #8fa4ff;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    display: grid;
    place-items: center;
    padding: env(safe-area-inset-top, 0) 24px env(safe-area-inset-bottom, 0);
    text-align: center;
  }
  main { width: 100%; max-width: 640px; }
  h1 {
    font-weight: 500;
    font-size: clamp(1.4rem, 5vw, 2rem);
    margin: 0 0 1.5rem;
    letter-spacing: 0.01em;
  }
  .days {
    font-weight: 300;
    font-size: clamp(7rem, 34vw, 14rem);
    line-height: 0.9;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    margin: 0;
  }
  .days-label {
    font-size: clamp(1.1rem, 4vw, 1.5rem);
    margin: 0.5rem 0 2rem;
    color: var(--muted);
  }
  .clock {
    font-size: clamp(1.4rem, 6vw, 2rem);
    font-variant-numeric: tabular-nums;
    margin: 0;
  }
  .when { margin: 1.5rem 0 0; color: var(--muted); font-size: 1rem; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="days" id="days" aria-live="off">0</p>
  <p class="days-label" id="daysLabel">days to go</p>
  <p class="clock" id="clock"></p>
  <p class="when" id="when"></p>
</main>

<script>
  // ---- Edit these defaults, or override them in the URL: ?date=2027-01-01&title=Our%20trip ----
  const DEFAULT_DATE  = "2026-12-20";  // YYYY-MM-DD, local time
  const DEFAULT_TITLE = "Until we see each other";

  const params = new URLSearchParams(location.search);
  const dateStr = params.get("date") || DEFAULT_DATE;
  const title   = params.get("title") || DEFAULT_TITLE;

  // Parse as local midnight (new Date("2027-01-01") would use UTC and be off by a day)
  const [y, m, d] = dateStr.split("-").map(Number);
  const target = new Date(y, m - 1, d, 0, 0, 0);

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");

  $("title").textContent = title;
  document.title = title;
  $("when").textContent = target.toLocaleDateString(undefined, {
    weekday: "long", year: "numeric", month: "long", day: "numeric"
  });

  function tick() {
    const diff = target - new Date();

    if (isNaN(diff)) {
      $("days").textContent = "?";
      $("daysLabel").textContent = "Check the date: use the format YYYY-MM-DD";
      $("clock").textContent = "";
      return;
    }

    if (diff <= 0) {
      const since = Math.floor(-diff / 86400000);
      $("days").textContent = since === 0 ? "Today" : since;
      $("days").style.fontSize = since === 0 ? "clamp(4rem, 20vw, 8rem)" : "";
      $("daysLabel").textContent = since === 0 ? "It’s here." : (since === 1 ? "day since" : "days since");
      $("clock").textContent = "";
      return;
    }

    const totalSec = Math.floor(diff / 1000);
    const days = Math.floor(totalSec / 86400);
    const hours = Math.floor((totalSec % 86400) / 3600);
    const mins = Math.floor((totalSec % 3600) / 60);
    const secs = totalSec % 60;

    $("days").textContent = days;
    $("daysLabel").textContent = days === 1 ? "day to go" : "days to go";
    $("clock").textContent = pad(hours) + ":" + pad(mins) + ":" + pad(secs);
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
